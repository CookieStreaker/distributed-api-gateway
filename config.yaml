server:
  port: 8080
  admin_port: 8081
  read_timeout: 30s
  write_timeout: 30s

redis:
  addr: "redis:6379"
  password: ""
  db: 0

# Global fallback rate limit when not overridden by route
rate_limit:
  capacity: 10
  refill_rate: 2

routes:
  - path_prefix: "/users"
    upstream_url: "http://user-service:80"

  - path_prefix: "/products"
    upstream_url: "http://product-service:80"
    rate_limit:
      capacity: 5
      refill_rate: 1
