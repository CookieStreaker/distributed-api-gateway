services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      redis:
        condition: service_started
      user-service:
        condition: service_started
      product-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - gateway-net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - gateway-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - gateway-net

  user-service:
    image: traefik/whoami
    restart: unless-stopped
    networks:
      - gateway-net

  product-service:
    image: traefik/whoami
    restart: unless-stopped
    networks:
      - gateway-net

volumes:
  redis-data:
  prometheus-data:

networks:
  gateway-net:
    driver: bridge